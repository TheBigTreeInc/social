# Operator-invoked evidence collection ONLY. It has no publication credentials.
name: Prepare Tavi release candidate
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character main commit SHA approved for candidate inspection'
        required: true
        type: string
      candidate_scope:
        description: 'Candidate platforms; Windows and signed Android first, full later'
        required: true
        default: windows-android
        type: choice
        options:
          - windows-android
          - full
permissions:
  contents: read
  actions: read
concurrency:
  group: tavi-release-candidate-${{ inputs.candidate_scope }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact-commit CI and prepare candidate (no publication)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_SCOPE: ${{ inputs.candidate_scope }}
        run: python tools/release-gate.py
      - name: Upload review-only candidate and evidence
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tavi-candidate-${{ inputs.candidate_scope }}-${{ inputs.candidate_sha }}
          path: |
            release-assets/
            release-assets-notes.md
            release-candidate.json
          retention-days: 30
          if-no-files-found: error
