name: Tavi browser UI QA
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client and Playwright dependencies
        run: npm install --prefix client --no-audit --no-fund
      - name: Install headless Chromium and system dependencies
        run: npx playwright-core install --with-deps chromium
        working-directory: client
      - name: Build and exercise Tavi UI at desktop and mobile viewports
        run: npm --prefix client run ui:ci
      - name: Publish UI screenshots and result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavi-ui-qa-${{ github.run_number }}
          path: client/qa-artifacts/
          if-no-files-found: warn
