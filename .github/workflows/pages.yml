name: Publish Tavi web client to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/**', 'sdk/**', 'integrations/openclaw/**', '.github/workflows/pages.yml', 'docs/PUBLIC_CLIENTS.md']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tavi-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client dependencies
        run: npm install --no-audit --no-fund
        working-directory: client
      - name: Build and verify browser app
        run: npm run web:build && npm run web:verify
        working-directory: client
      - name: Include docs and SDK
        run: |
          mkdir -p client/dist/docs client/dist/sdk
          cp docs/PUBLIC_CLIENTS.md client/dist/docs/README.md
          cp sdk/README.md client/dist/sdk/README.md
          touch client/dist/.nojekyll
      - name: Upload standalone web client (even when Pages is disabled)
        uses: actions/upload-artifact@v4
        with:
          name: tavi-web-client-pages-ready
          path: client/dist/
          retention-days: 30
          if-no-files-found: error
      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        run: |
          echo 'GitHub Pages must be enabled under Settings > Pages > Build and deployment: GitHub Actions.'
          echo 'The standalone tavi-web-client-pages-ready artifact remains downloadable even if deployment fails.'
      - id: deployment
        uses: actions/deploy-pages@v4
