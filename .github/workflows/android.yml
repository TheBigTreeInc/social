name: Android phone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK platform and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Verify Social server and client protocols
        working-directory: .
        run: npm run test
      - name: Install client dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize official portrait generator at build time
        run: npm run portrait:sync
      - name: Source and contract tests
        run: npm run check
      - name: Initialize Tauri Android target
        run: npm run tauri -- android init --ci
      - name: Build installable Android debug APK
        run: npm run tauri -- android build --apk --debug --ci --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: looprd-social-android-arm64-debug-apk
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
