name: SDK source packages and OpenClaw bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ['sdk/**', 'client/sdk/**', 'integrations/openclaw/**', '.github/workflows/sdk-distributions.yml']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bundle portable SDK source packages
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          out=Path('sdk-distributions');out.mkdir(exist_ok=True)
          groups={'javascript':['client/sdk'], 'python':['sdk/python'], 'go':['sdk/go'], 'dotnet':['sdk/csharp'], 'openclaw':['integrations/openclaw','client/sdk']}
          for name,dirs in groups.items():
              dest=out/f'tavi-{name}-source.zip'
              with ZipFile(dest,'w',ZIP_DEFLATED) as z:
                  for folder in dirs:
                      for p in sorted(Path(folder).rglob('*')):
                          if p.is_file() and not any(seg in ('node_modules','__pycache__','target','.git','.venv') for seg in p.parts):z.write(p)
              print(dest)
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: tavi-sdk-and-openclaw-source-packages
          path: sdk-distributions/*.zip
          if-no-files-found: error
          retention-days: 30
