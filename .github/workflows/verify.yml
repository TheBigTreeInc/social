name: Verify Social server and client source
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run verify
      - run: python tools/generate-looprd.py --check
      - run: node client/tools/check-package.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
