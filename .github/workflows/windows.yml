name: Windows desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Social server and client protocols
        working-directory: .
        run: npm run test
      - name: Install client dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize official portrait generator at build time
        run: npm run portrait:sync
      - name: Source and contract tests
        run: npm run check
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: looprd-social-windows-nsis
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
