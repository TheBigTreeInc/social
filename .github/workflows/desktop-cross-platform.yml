name: Experimental macOS and Linux Tavi desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install client dependencies
        run: npm install --no-audit --no-fund
        working-directory: client
      - name: Build Tauri desktop bundle
        run: npm run tauri -- build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: tavi-${{ matrix.name }}-unsigned
          path: client/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
