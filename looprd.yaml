    \                if stored:\n                    db.execute(sa.update(PROFILE).where(PROFILE.c.subjectId==subject).values(\n\
    \                        data=p,revision=before+1,updated=now))\n                else:\n                   \
    \ db.execute(sa.insert(PROFILE).values(subjectId=subject,data=p,\n                        revision=1,updated=now))\n\
    \                return {'ok':True,'profile':p,'revision':before+1},event_signal(db)\n            if op=='chat_feed':\n\
    \                rows=db.execute(sa.select(MESSAGE).where(MESSAGE.c.created>=now-7*86400)\n                \
    \    .order_by(MESSAGE.c.id.desc()).limit(50)).mappings().all()\n                messages=[{'id':m['id'],'authorId':m['subjectId'],'displayName':m['displayName'],\n\
    \                           'text':m['content'],'at':m['created']} for m in reversed(rows)]\n              \
    \  return {'ok':True,'schema':'looprd.social.chat/v1','messages':messages},None\n            if op=='chat_send':\n\
    \                content=body.get('text')\n                if not isinstance(content,str) or not 1<=len(content.strip())<=320\
    \ or re.search(r'[\\x00-\\x08\\x0e-\\x1f\\x7f]',content):\n                    return error('Invalid chat message'),None\n\
    \                last=db.execute(sa.select(MESSAGE.c.created).where(MESSAGE.c.subjectId==subject)\n        \
    \            .order_by(MESSAGE.c.id.desc()).limit(1)).scalar_one_or_none()\n                if last is not None\
    \ and now-last<2:\n                    return error('Chat cooldown: wait 2 seconds'),None\n                db.execute(sa.insert(MESSAGE).values(subjectId=subject,\n\
    \                    displayName=current['displayName'],content=content.strip(),created=now))\n            \
    \    new_id=db.execute(sa.select(MESSAGE.c.id).order_by(MESSAGE.c.id.desc()).limit(1)).scalar_one()\n      \
    \          # Bounded 7-day/100-message history. No game states or tokens retained.\n                db.execute(sa.delete(MESSAGE).where(MESSAGE.c.created<now-7*86400))\n\
    \                keep=db.execute(sa.select(MESSAGE.c.id).order_by(MESSAGE.c.id.desc()).limit(100)).scalars().all()\n\
    \                if keep:db.execute(sa.delete(MESSAGE).where(MESSAGE.c.id.not_in(keep)))\n                message={'id':new_id,'authorId':subject,\n\
    \                    'displayName':current['displayName'],'text':content.strip(),'at':now}\n               \
    \ return {'ok':True,'message':message},event_signal(db)\n            if op=='game_ticket':\n               \
    \ return error('Game tickets require application-owned verified identity and game-service validation; not implemented'),None\n\
    \            return error('Unknown operation'),None\n    except sa.exc.IntegrityError:\n        return error('Account\
    \ or contact already exists'),None\n    except (ValueError,TypeError) as exc:\n        return error(str(exc)),None\n\
    \n\ndef principal_id(subject):\n    \"\"\"Exactly LoopRD's verified realm+subject ID formula, not a client-supplied\
    \ ID.\"\"\"\n    return hashlib.sha256(('tavi-social\\0' + subject).encode('utf8')).hexdigest()\n\n\ndef process_event(ctx):\n\
    \    \"\"\"Use the same transaction for application writes, event and push outbox.\"\"\"\n    body=ctx.body\n\
    \    op=body.get('op') if isinstance(body,dict) else None\n    principal=ctx.principal.subject\n    with ctx.transaction()\
    \ as db:\n        result,event=execute(body,ctx.session_factory,db=db,principal_subject=principal)\n       \
    \ # Account recovery invalidates the existing account's push endpoints as\n        # well as bearer sessions.\
    \ A queued content-free hint must not keep\n        # waking a device whose account credential was revoked.\n\
    \        if result.get('ok') and op=='recover_account' and ctx.revoke_push:\n            ctx.revoke_push(db,principal_id(result['profileId']))\n\
    \        if result.get('ok') and event is not None:\n            ctx.emit(db,{k:v for k,v in event.items() if\
    \ k!='component'})\n            recipient=None\n            if op=='dm_send':\n                recipient=body.get('peer')\n\
    \            elif op=='contact_request':\n                recipient=account_subject(db,username(body.get('username')))\n\
    \            elif op in ('contact_accept','contact_remove'):\n                recipient=body.get('peer')\n \
    \           elif op=='interaction_publish':\n                recipient=account_subject(db,username(body.get('recipient')))\n\
    \            if recipient and recipient != principal and re.fullmatch(r'acct_[0-9]{1,19}',recipient):\n    \
    \            ctx.notify(db,principal_id(recipient))\n    return result\n\n\nasync def handle(ctx):\n    op=ctx.body.get('op')\
    \ if isinstance(ctx.body,dict) else None\n    changing=op in {'interaction_reply','interaction_dismiss','interaction_publish',\n\
    \                    'contact_request','contact_accept','contact_remove','dm_mark_read',\n                 \
    \   'dm_send','save_profile','chat_send','recover_account'}\n    if changing:\n        return await run_in_threadpool(process_event,ctx)\n\
    \    result,event=await run_in_threadpool(execute,ctx.body,ctx.session_factory,principal_subject=ctx.principal.subject)\n\
    \    # login/register create an account-specific session; the identity is checked on\n    # the *next* request.\
    \ No push is sent for guest operations or regular reads.\n    return result\n"
- path: /ecosystem/admin-notify
  method: POST
  kind: python
  scopes:
  - social:service
  source: "\"\"\"Trusted service-contract handler delivering a Tavi inbox event to ecosystem admins.\n\nThe Social\
    \ verified verifier authenticates the calling component as kind=service.\nNo Tavi user can call this endpoint\
    \ with their ordinary account credential.\n\"\"\"\nimport hashlib\nimport json\nimport ipaddress\nimport re\n\
    import time\nfrom urllib.parse import urlsplit\n\nimport sqlalchemy as sa\nfrom starlette.concurrency import\
    \ run_in_threadpool\n\nMAX_ADMIN_RECIPIENTS = 100\n\n\ndef safe_https_url(value):\n    if not isinstance(value,\
    \ str) or len(value) > 2048 or any(ord(c) < 33 or c == '\\\\' for c in value):\n        return False\n    try:\n\
    \        url = urlsplit(value)\n        if url.scheme != 'https' or not url.hostname or url.username or url.password\
    \ or url.fragment or url.port not in (None, 443):\n            return False\n        host=url.hostname.lower()\n\
    \        if host in ('localhost', 'localhost.localdomain') or host.endswith(('.localhost', '.local', '.internal')):\n\
    \            return False\n        try:\n            ip=ipaddress.ip_address(host)\n            if not ip.is_global:\n\
    \                return False\n        except ValueError:\n            pass\n        return True\n    except\
    \ (ValueError, TypeError):\n        return False\n\n\ndef build_interaction(body):\n    topic=body.get('topic')\n\
    \    title=body.get('title')\n    description=body.get('body','')\n    link=body.get('url')\n    ttl=body.get('ttlSeconds',86400)\n\
    \    if (not isinstance(topic,str) or not re.fullmatch(r'[a-z][a-z0-9_.-]{1,79}',topic)\n            or not\
    \ isinstance(title,str) or not 1 <= len(title) <= 120\n            or not isinstance(description,str) or len(description)>2000\n\
    \            or any(ord(char)<32 or ord(char)==127 for char in topic+title)\n            or type(ttl) is not\
    \ int or not 60 <= ttl <= 604800):\n        return None\n    if link is not None and not safe_https_url(link):\n\
    \        return None\n    actions=[{'id':'open-link','type':'open-url','label':'Open details',\n           \
    \   'url':link,'presentation':'external-browser'}] if link else [\n              {'id':'acknowledge','type':'reply','label':'Acknowledge','fields':[]}]\n\
    \    return {'topic':topic,'title':title,'body':description,'actions':actions},ttl\n\n\ndef principal_id(subject):\n\
    \    return hashlib.sha256(('tavi-social\\0'+subject).encode('utf8')).hexdigest()\n\n\ndef deliver(ctx):\n \
    \   if getattr(ctx.principal,'kind',None)!='service' or not re.fullmatch(r'[a-z][a-z0-9-]{1,47}',ctx.principal.subject\
    \ or ''):\n        return {'accepted':False,'recipients':0,'reason':'service_identity_required'}\n    constructed=build_interaction(ctx.body\
    \ or {})\n    if constructed is None:\n        return {'accepted':False,'recipients':0,'reason':'invalid_interaction'}\n\
    \    data,ttl=constructed\n    now=int(time.time())\n    with ctx.transaction() as session:\n        admins=session.execute(sa.text('SELECT\
    \ id FROM \"SocialAccount\" WHERE \"ecosystemAdmin\" = 1 ORDER BY id LIMIT :limit'),\n            {'limit':MAX_ADMIN_RECIPIENTS+1}).scalars().all()\n\
    \        if len(admins)>MAX_ADMIN_RECIPIENTS:\n            return {'accepted':False,'recipients':0,'reason':'recipient_limit'}\n\
    \        if not admins:\n            return {'accepted':True,'recipients':0}\n        for account_id in admins:\n\
    \            subject='acct_'+str(account_id)\n            session.execute(sa.text('''INSERT INTO \"SocialInteraction\"\
    \ (\"recipient\",\"publisher\",\"topic\",\"title\",\"data\",\"status\",\"response\",\"created\",\"expires\"\
    )\n                VALUES (:recipient,:publisher,:topic,:title,:data,'open',NULL,:created,:expires)'''),\n \
    \               {'recipient':subject,'publisher':'service:'+ctx.principal.subject,\n                 'topic':data['topic'],'title':data['title'],\n\
    \                 'data':json.dumps(data),'created':now,'expires':now+ttl})\n        row=session.execute(sa.text('SELECT\
    \ signal FROM \"SocialPulse\" WHERE id=1')).first()\n        signal=(row[0] if row else 0)+1\n        if row:\n\
    \            session.execute(sa.text('UPDATE \"SocialPulse\" SET signal=:signal WHERE id=1'),{'signal':signal})\n\
    \        else:\n            session.execute(sa.text('INSERT INTO \"SocialPulse\" (id,signal) VALUES (1,:signal)'),{'signal':signal})\n\
    \        ctx.emit(session,{'resource':'pulses','action':'updated','id':1,'data':{'id':1,'signal':signal}})\n\
    \        for account_id in admins:\n            ctx.notify(session,principal_id('acct_'+str(account_id)))\n\
    \    return {'accepted':True,'recipients':len(admins)}\n\n\nasync def handle(ctx):\n    return await run_in_threadpool(deliver,ctx)\n"
  contract:
    name: tavi-admin-notify
    version: 1
    serviceOnly: true
    request:
      type: object
      required:
      - topic
      - title
      additionalProperties: false
      properties:
        topic:
          type: string
          minLength: 2
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
    response:
      type: object
      required:
      - accepted
      - recipients
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        recipients:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 48
- path: /ecosystem/game-event
  method: POST
  kind: python
  scopes:
  - social:service
  source: "\"\"\"Reviewed game component -> individual Tavi account turn delivery.\n\nNever use this for arbitrary\
    \ recipient targeting. A player must have explicitly\nsubscribed to (publisher, game, match) through their authenticated\
    \ Social session.\nThe caller is an operator-admitted LoopRD service credential, not a user token.\n\"\"\"\n\
    import hashlib\nimport json\nimport os\nimport re\nimport time\nfrom urllib.parse import urlencode, urlsplit\n\
    \nimport sqlalchemy as sa\nfrom starlette.concurrency import run_in_threadpool\n\nGAME_ID = re.compile(r'^[a-z][a-z0-9.]{1,95}$')\n\
    MATCH_ID = re.compile(r'^[A-Za-z0-9_-]{12,128}$')\nEVENT_ID = re.compile(r'^[A-Za-z0-9_-]{8,96}$')\nCOMPONENT_ID\
    \ = re.compile(r'^[a-z][a-z0-9-]{1,47}$')\nSUBJECT = re.compile(r'^acct_[1-9][0-9]{0,18}$')\nALLOWED_KINDS =\
    \ {'turn.ready', 'turn.reminder', 'match.completed', 'invite.created'}\n\n\ndef configured_publishers():\n \
    \   \"\"\"Operator-only allowlist of game IDs per service caller. Empty = deny.\"\"\"\n    try:\n        data\
    \ = json.loads(os.environ.get('LOOPRD_TAVI_GAME_CALLERS_JSON', '{}'))\n    except (ValueError, TypeError):\n\
    \        return {}\n    if not isinstance(data, dict) or len(data) > 32:\n        return {}\n    return {key:\
    \ tuple(value) for key, value in data.items()\n            if isinstance(key, str) and COMPONENT_ID.fullmatch(key)\n\
    \            and isinstance(value, list) and 0 < len(value) <= 32\n            and all(isinstance(item, str)\
    \ and GAME_ID.fullmatch(item) for item in value)}\n\n\ndef approved_game_label(game_id):\n    # Operator-reviewed\
    \ presentation metadata; never accept title/body from game payload.\n    try:\n        names = json.loads(os.environ.get('LOOPRD_TAVI_GAME_LABELS_JSON',\
    \ '{}'))\n    except (ValueError, TypeError):\n        return game_id\n    if not isinstance(names, dict) or\
    \ len(names) > 100:\n        return game_id\n    name = names.get(game_id)\n    return name.strip() if isinstance(name,\
    \ str) and 1 <= len(name.strip()) <= 64 and not any(ord(c) < 32 for c in name) else game_id\n\n\ndef approved_atrium_url(game_id,\
    \ match_id):\n    \"\"\"Derive navigation from a private operator binding, never from game payload.\"\"\"\n\
    \    base = os.environ.get('LOOPRD_TAVI_ATRIUM_BASE_URL', '')\n    if not base or len(base) > 512 or any(ord(c)\
    \ < 33 or c == '\\\\' for c in base):\n        return None\n    try:\n        url = urlsplit(base)\n       \
    \ if (url.scheme != 'https' or not url.hostname or url.username or url.password or url.query or url.fragment\n\
    \                or url.port not in (None, 443) or not base.endswith('/')\n                or url.hostname in\
    \ ('localhost', 'localhost.localdomain') or url.hostname.endswith(('.localhost', '.local', '.internal'))):\n\
    \            return None\n        import ipaddress\n        try:\n            ip = ipaddress.ip_address(url.hostname)\n\
    \            if not ip.is_global:\n                return None\n        except ValueError:\n            pass\n\
    \    except (ValueError, TypeError):\n        return None\n    # An opaque match reference is NOT a room access\
    \ token. Atrium must authorize it.\n    return base + '?' + urlencode({'game': game_id, 'match': match_id})\n\
    \n\ndef game_interaction(kind, game_id, match_id, caller, event_id=None, turn_index=None):\n    title = {'turn.ready':\
    \ \"It's your turn\", 'turn.reminder': 'Turn reminder',\n             'match.completed': 'Game completed', 'invite.created':\
    \ 'Game invitation'}[kind]\n    title += ' · ' + approved_game_label(game_id)\n    link = approved_atrium_url(game_id,\
    \ match_id)\n    actions = ([{'id':'accept-game','type':'reply','label':'Accept invitation','fields':[]},\n\
    \                {'id':'decline-game','type':'reply','label':'Decline','fields':[]}] if kind=='invite.created'\
    \ else\n               [{'id': 'open-atrium', 'type': 'open-url', 'label': 'Open in Atrium',\n             \
    \    'url': link, 'presentation': 'external-browser'}] if link else\n               [{'id': 'acknowledge', 'type':\
    \ 'reply', 'label': 'Acknowledge', 'fields': []}])\n    return {'title': title, 'topic': 'game.' + kind, 'body':\
    \ (('A friend invited you to play. Accept to receive game updates.' if kind=='invite.created' else 'Open Atrium\
    \ to continue.') if link else\n            'Atrium is not configured on this Social server yet.'), 'actions':\
    \ actions,\n            'game': {'schema': 'tavi.game-event/v1', 'kind': kind, 'gameId': game_id,\n        \
    \             'matchId': match_id, 'publisher': caller, 'eventId': event_id,\n                     'turnIndex':\
    \ turn_index}}\n\n\ndef validate_event(body, caller):\n    expected={'schema','eventId','kind','gameId','matchId','turnIndex','recipient'}\n\
    \    if not isinstance(body, dict) or set(body) != (expected | {'inviter'} if body.get('kind')=='invite.created'\
    \ else expected):\n        return None\n    recipient = body.get('recipient')\n    issuer = os.environ.get('LOOPRD_TAVI_SOCIAL_ISSUER',\
    \ '')\n    if (body.get('schema') != 'tavi.game-event/v1' or body.get('kind') not in ALLOWED_KINDS\n       \
    \     or not isinstance(body.get('gameId'), str) or not GAME_ID.fullmatch(body['gameId'])\n            or not\
    \ isinstance(body.get('matchId'), str) or not MATCH_ID.fullmatch(body['matchId'])\n            or not isinstance(body.get('eventId'),\
    \ str) or not EVENT_ID.fullmatch(body['eventId'])\n            or type(body.get('turnIndex')) is not int or\
    \ not 0 <= body['turnIndex'] <= 10000000\n            or not isinstance(recipient, dict) or set(recipient) !=\
    \ {'issuer', 'subject'}\n            or not isinstance(recipient.get('subject'), str) or not SUBJECT.fullmatch(recipient['subject'])\n\
    \            or not issuer or len(issuer) > 128 or recipient.get('issuer') != issuer\n            or body['gameId']\
    \ not in configured_publishers().get(caller, ())\n            or (body['kind']=='invite.created' and (not isinstance(body.get('inviter'),dict)\n\
    \                or set(body['inviter'])!={'issuer','subject'}\n                or body['inviter'].get('issuer')\
    \ != issuer\n                or not isinstance(body['inviter'].get('subject'),str)\n                or not SUBJECT.fullmatch(body['inviter']['subject'])))):\n\
    \        return None\n    return body\n\n\ndef principal_id(subject):\n    return hashlib.sha256(('tavi-social\\\
    0' + subject).encode()).hexdigest()\n\n\ndef deliver(ctx):\n    caller = getattr(ctx.principal, 'subject', None)\n\
    \    if getattr(ctx.principal, 'kind', None) != 'service' or not isinstance(caller, str) or not COMPONENT_ID.fullmatch(caller):\n\
    \        return {'accepted': False, 'delivery': 'rejected', 'reason': 'service_identity_required'}\n    body\
    \ = validate_event(ctx.body, caller)\n    if body is None:\n        return {'accepted': False, 'delivery': 'rejected',\
    \ 'reason': 'invalid_or_unapproved_event'}\n    recipient = body['recipient']['subject']\n    now = int(time.time())\n\
    \    fingerprint = hashlib.sha256(json.dumps(body, sort_keys=True, separators=(',', ':')).encode()).hexdigest()\n\
    \    with ctx.transaction() as session:\n        prior = session.execute(sa.text('''SELECT digest FROM \"SocialGameDelivery\"\
    \n            WHERE publisher=:publisher AND eventId=:eventId AND recipient=:recipient'''),\n            {'publisher':\
    \ caller, 'eventId': body['eventId'], 'recipient': recipient}).scalar_one_or_none()\n        if prior is not\
    \ None:\n            if prior != fingerprint:\n                return {'accepted': False, 'delivery': 'rejected',\
    \ 'reason': 'event_id_conflict'}\n            return {'accepted': True, 'delivery': 'duplicate'}\n        #\
    \ An invitation is explicitly initiated by an approved game service on behalf\n        # of an existing accepted\
    \ contact. It never enrolls a recipient automatically.\n        if body['kind']=='invite.created':\n       \
    \     inviter=body['inviter']['subject']\n            if inviter==recipient:\n                return {'accepted':False,'delivery':'rejected','reason':'not_accepted_contacts'}\n\
    \            left,right=sorted((inviter,recipient))\n            contact=session.execute(sa.text('''SELECT id\
    \ FROM \"SocialContact\" WHERE leftId=:left\n                AND rightId=:right AND status='accepted' '''),{'left':left,'right':right}).first()\n\
    \            if not contact:\n                return {'accepted':False,'delivery':'rejected','reason':'not_accepted_contacts'}\n\
    \        # Proof of consent is an authenticated Social subscription, NOT knowledge of an account ID.\n     \
    \   eligible = session.execute(sa.text('''SELECT id FROM \"SocialGameSubscription\"\n            WHERE subjectId=:subject\
    \ AND publisher=:publisher AND gameId=:gameId\n              AND matchId=:matchId AND enabled=1'''),\n     \
    \       {'subject': recipient, 'publisher': caller, 'gameId': body['gameId'], 'matchId': body['matchId']}).first()\n\
    \        if not eligible and body['kind']!='invite.created':\n            return {'accepted': False, 'delivery':\
    \ 'rejected', 'reason': 'recipient_not_subscribed'}\n        data = game_interaction(body['kind'], body['gameId'],\
    \ body['matchId'], caller,\n                                body['eventId'], body['turnIndex'])\n        if\
    \ body['kind']=='invite.created':\n            data['game']['inviter']=body['inviter']['subject']\n        stored\
    \ = session.execute(sa.text('''INSERT INTO \"SocialInteraction\"\n            (recipient,publisher,topic,title,data,status,response,created,expires)\n\
    \            VALUES (:recipient,:publisher,:topic,:title,:data,'open',NULL,:created,:expires)\n            RETURNING\
    \ id'''), {'recipient': recipient, 'publisher': 'game:' + caller,\n                               'topic': data['topic'],\
    \ 'title': data['title'], 'data': json.dumps(data),\n                               'created': now, 'expires':\
    \ now + (7 if body['kind']=='invite.created' else 366) * 86400}).scalar_one()\n        session.execute(sa.text('''INSERT\
    \ INTO \"SocialGameDelivery\" (publisher,eventId,recipient,digest,interactionId,created)\n            VALUES\
    \ (:publisher,:eventId,:recipient,:digest,:interactionId,:created)'''),\n            {'publisher': caller, 'eventId':\
    \ body['eventId'], 'recipient': recipient,\n             'digest': fingerprint, 'interactionId': stored, 'created':\
    \ now})\n        row = session.execute(sa.text('SELECT signal FROM \"SocialPulse\" WHERE id=1')).first()\n \
    \       if row:\n            signal = row[0] + 1\n            session.execute(sa.text('UPDATE \"SocialPulse\"\
    \ SET signal=:n WHERE id=1'), {'n': signal})\n        else:\n            signal = 1\n            session.execute(sa.text('INSERT\
    \ INTO \"SocialPulse\" (id,signal) VALUES (1,1)'))\n        ctx.emit(session, {'resource': 'pulses', 'action':\
    \ 'updated', 'id': 1, 'data': {'id': 1, 'signal': signal}})\n        if ctx.notify is not None:\n          \
    \  ctx.notify(session, principal_id(recipient))\n    return {'accepted': True, 'delivery': 'created'}\n\n\n\
    async def handle(ctx):\n    return await run_in_threadpool(deliver, ctx)\n"
  contract:
    name: tavi-game-event
    version: 1
    serviceOnly: true
    request:
      type: object
      required:
      - schema
      - eventId
      - kind
      - gameId
      - matchId
      - turnIndex
      - recipient
      additionalProperties: false
      properties:
        schema:
          type: string
          enum:
          - tavi.game-event/v1
        eventId:
          type: string
          minLength: 8
          maxLength: 96
        kind:
          type: string
          enum:
          - turn.ready
          - turn.reminder
          - match.completed
          - invite.created
        gameId:
          type: string
          minLength: 2
          maxLength: 96
        matchId:
          type: string
          minLength: 12
          maxLength: 128
        turnIndex:
          type: integer
          minimum: 0
        recipient:
          type: object
          required:
          - issuer
          - subject
          additionalProperties: false
          properties:
            issuer:
              type: string
              minLength: 1
              maxLength: 128
            subject:
              type: string
              minLength: 6
              maxLength: 72
        inviter:
          type: object
          required:
          - issuer
          - subject
          additionalProperties: false
          properties:
            issuer:
              type: string
              minLength: 1
              maxLength: 128
            subject:
              type: string
              minLength: 6
              maxLength: 72
    response:
      type: object
      required:
      - accepted
      - delivery
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        delivery:
          type: string
          enum:
          - created
          - duplicate
          - rejected
        reason:
          type: string
          maxLength: 80
- path: /ecosystem/game-grant-redeem
  method: POST
  kind: python
  scopes:
  - social:service
  source: "\"\"\"One-use, account-bound, game-scoped proof redemption for trusted local LoopRD services.\n\nA redeemed\
    \ grant proves the account authenticated to this Social issuer. The game\nMUST separately authorize match invitations,\
    \ seat ownership, and game actions.\nGrants never embed Social bearer tokens. Calls are same-runtime ctx.call\
    \ only.\n\"\"\"\nimport hashlib\nimport os\nimport re\nimport time\n\nimport sqlalchemy as sa\nfrom starlette.concurrency\
    \ import run_in_threadpool\n\nGAME = re.compile(r'^[a-z][a-z0-9.]{1,95}$')\nMATCH = re.compile(r'^[A-Za-z0-9_-]{12,128}$')\n\
    COMPONENT = re.compile(r'^[a-z][a-z0-9-]{1,47}$')\n\n\ndef redeem(ctx):\n    caller = getattr(ctx.principal,\
    \ 'subject', None)\n    if getattr(ctx.principal, 'kind', None) != 'service' or not isinstance(caller, str)\
    \ or not COMPONENT.fullmatch(caller):\n        return {'accepted': False, 'reason': 'not_available'}\n    body\
    \ = ctx.body\n    if (type(body) is not dict or set(body) != {'grant', 'gameId', 'matchId'}\n            or\
    \ not isinstance(body.get('grant'), str) or not re.fullmatch(r'[A-Za-z0-9_-]{42,128}', body['grant'])\n    \
    \        or not isinstance(body.get('gameId'), str) or not GAME.fullmatch(body['gameId'])\n            or not\
    \ isinstance(body.get('matchId'), str) or not MATCH.fullmatch(body['matchId'])):\n        return {'accepted':\
    \ False, 'reason': 'not_available'}\n    # Revoking an operator-approved publisher prevents even unexpired grants.\n\
    \    try:\n        import json\n        allowed = json.loads(os.environ.get('LOOPRD_TAVI_GAME_CALLERS_JSON',\
    \ '{}'))\n        if not isinstance(allowed, dict) or body['gameId'] not in allowed.get(caller, []):\n     \
    \       return {'accepted':False,'reason':'not_available'}\n    except (ValueError, TypeError):\n        return\
    \ {'accepted':False,'reason':'not_available'}\n    issuer = os.environ.get('LOOPRD_TAVI_SOCIAL_ISSUER', '')\n\
    \    if not issuer or len(issuer) > 128:\n        return {'accepted': False, 'reason': 'not_available'}\n  \
    \  now = int(time.time())\n    with ctx.transaction() as session:\n        row = session.execute(sa.text('''SELECT\
    \ subjectId, sessionHash, gameId, matchId, publisher, expires, consumed\n             FROM \"SocialGameGrant\"\
    \ WHERE tokenHash=:digest'''),\n             {'digest': hashlib.sha256(body['grant'].encode('ascii')).hexdigest()}).mappings().first()\n\
    \        if (not row or row['consumed'] or row['expires'] <= now or row['publisher'] != caller\n           \
    \     or row['gameId'] != body['gameId'] or row['matchId'] != body['matchId']):\n            return {'accepted':\
    \ False, 'reason': 'not_available'}\n        active = session.execute(sa.text('''SELECT id FROM \"SocialSession\"\
    \ WHERE subjectId=:subject\n            AND tokenHash=:token AND revoked=0 AND expires>:now'''),\n         \
    \   {'subject': row['subjectId'], 'token': row['sessionHash'], 'now': now}).first()\n        subscribed = session.execute(sa.text('''SELECT\
    \ id FROM \"SocialGameSubscription\" WHERE subjectId=:subject\n            AND publisher=:publisher AND gameId=:game\
    \ AND matchId=:match AND enabled=1'''),\n            {'subject':row['subjectId'], 'publisher':caller, 'game':row['gameId'],\
    \ 'match':row['matchId']}).first()\n        if not active or not subscribed:\n            return {'accepted':False,'reason':'not_available'}\n\
    \        changed = session.execute(sa.text('''UPDATE \"SocialGameGrant\" SET consumed=1\n            WHERE tokenHash=:digest\
    \ AND consumed=0 AND expires>:now'''),\n            {'digest':hashlib.sha256(body['grant'].encode('ascii')).hexdigest(),'now':now})\n\
    \        if changed.rowcount != 1:\n            return {'accepted':False,'reason':'not_available'}\n       \
    \ return {'accepted':True,'issuer':issuer,'subject':row['subjectId'],\n                'gameId':row['gameId'],'matchId':row['matchId'],'scope':'game:identify'}\n\
    \n\nasync def handle(ctx):\n    return await run_in_threadpool(redeem,ctx)\n"
  contract:
    name: tavi-game-grant-redeem
    version: 1
    serviceOnly: true
    request:
      type: object
      required:
      - grant
      - gameId
      - matchId
      additionalProperties: false
      properties:
        grant:
          type: string
          minLength: 42
          maxLength: 128
        gameId:
          type: string
          minLength: 2
          maxLength: 96
        matchId:
          type: string
          minLength: 12
          maxLength: 128
    response:
      type: object
      required:
      - accepted
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        reason:
          type: string
          maxLength: 80
        issuer:
          type: string
          maxLength: 128
        subject:
          type: string
          maxLength: 72
        gameId:
          type: string
          maxLength: 96
        matchId:
          type: string
          maxLength: 128
        scope:
          type: string
          maxLength: 40
- path: /ecosystem/admin-role
  method: POST
  kind: python
  scopes:
  - social:service
  source: "\"\"\"Trusted service contract for checking the current Tavi administrator role.\"\"\"\nimport re\nimport\
    \ sqlalchemy as sa\nfrom starlette.concurrency import run_in_threadpool\n\n\ndef current_role(sessions, subject):\n\
    \    if not isinstance(subject,str) or not re.fullmatch(r'acct_[1-9][0-9]{0,18}',subject):\n        return False\n\
    \    with sessions() as db:\n        return db.execute(sa.text('SELECT \"ecosystemAdmin\" FROM \"SocialAccount\"\
    \ WHERE id=:id'),\n            {'id':int(subject[5:])}).scalar() == 1\n\n\nasync def handle(ctx):\n    if getattr(ctx.principal,'kind',None)!='service':\n\
    \        return {'admin':False}\n    return {'admin':await run_in_threadpool(current_role,ctx.session_factory,(ctx.body\
    \ or {}).get('subject'))}\n"
  contract:
    name: tavi-admin-role
    version: 1
    serviceOnly: true
    request:
      type: object
      required:
      - subject
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 6
          maxLength: 72
    response:
      type: object
      required:
      - admin
      additionalProperties: false
      properties:
        admin:
          type: boolean
