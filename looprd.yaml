    \                last=db.execute(sa.select(MESSAGE.c.created).where(MESSAGE.c.subjectId==subject)\n        \
    \            .order_by(MESSAGE.c.id.desc()).limit(1)).scalar_one_or_none()\n                if last is not None\
    \ and now-last<2:\n                    return error('Chat cooldown: wait 2 seconds'),None\n                db.execute(sa.insert(MESSAGE).values(subjectId=subject,\n\
    \                    displayName=current['displayName'],content=content.strip(),created=now))\n            \
    \    new_id=db.execute(sa.select(MESSAGE.c.id).order_by(MESSAGE.c.id.desc()).limit(1)).scalar_one()\n      \
    \          # Bounded 7-day/100-message history. No game states or tokens retained.\n                db.execute(sa.delete(MESSAGE).where(MESSAGE.c.created<now-7*86400))\n\
    \                keep=db.execute(sa.select(MESSAGE.c.id).order_by(MESSAGE.c.id.desc()).limit(100)).scalars().all()\n\
    \                if keep:db.execute(sa.delete(MESSAGE).where(MESSAGE.c.id.not_in(keep)))\n                message={'id':new_id,'authorId':subject,\n\
    \                    'displayName':current['displayName'],'text':content.strip(),'at':now}\n               \
    \ return {'ok':True,'message':message},event_signal(db)\n            if op=='game_ticket':\n               \
    \ return error('Game tickets require application-owned verified identity and game-service validation; not implemented'),None\n\
    \            return error('Unknown operation'),None\n    except sa.exc.IntegrityError:\n        return error('Account\
    \ or contact already exists'),None\n    except (ValueError,TypeError) as exc:\n        return error(str(exc)),None\n\
    \n\ndef principal_id(subject):\n    \"\"\"Exactly LoopRD's verified realm+subject ID formula, not a client-supplied\
    \ ID.\"\"\"\n    return hashlib.sha256(('tavi-social\\0' + subject).encode('utf8')).hexdigest()\n\n\ndef process_event(ctx):\n\
    \    \"\"\"Use the same transaction for application writes, event and push outbox.\"\"\"\n    body=ctx.body\n\
    \    op=body.get('op') if isinstance(body,dict) else None\n    principal=ctx.principal.subject\n    with ctx.transaction()\
    \ as db:\n        result,event=execute(body,ctx.session_factory,db=db,principal_subject=principal)\n       \
    \ if result.get('ok') and event is not None:\n            ctx.emit(db,{k:v for k,v in event.items() if k!='component'})\n\
    \            recipient=None\n            if op=='dm_send':\n                recipient=body.get('peer')\n   \
    \         elif op=='contact_request':\n                recipient=account_subject(db,username(body.get('username')))\n\
    \            elif op in ('contact_accept','contact_remove'):\n                recipient=body.get('peer')\n \
    \           elif op=='interaction_publish':\n                recipient=account_subject(db,username(body.get('recipient')))\n\
    \            if recipient and recipient != principal and re.fullmatch(r'acct_[0-9]{1,19}',recipient):\n    \
    \            ctx.notify(db,principal_id(recipient))\n    return result\n\n\nasync def handle(ctx):\n    op=ctx.body.get('op')\
    \ if isinstance(ctx.body,dict) else None\n    changing=op in {'interaction_reply','interaction_dismiss','interaction_publish',\n\
    \                    'contact_request','contact_accept','contact_remove','dm_mark_read',\n                 \
    \   'dm_send','save_profile','chat_send'}\n    if changing:\n        return await run_in_threadpool(process_event,ctx)\n\
    \    result,event=await run_in_threadpool(execute,ctx.body,ctx.session_factory,principal_subject=ctx.principal.subject)\n\
    \    # login/register create an account-specific session; the identity is checked on\n    # the *next* request.\
    \ No push is sent for guest operations or regular reads.\n    return result\n"
- path: /ecosystem/admin-notify
  method: POST
  kind: python
  scopes:
  - social:service
  source: "\"\"\"Trusted service-contract handler delivering a Tavi inbox event to ecosystem admins.\n\nThe Social\
    \ verified verifier authenticates the calling component as kind=service.\nNo Tavi user can call this endpoint\
    \ with their ordinary account credential.\n\"\"\"\nimport hashlib\nimport json\nimport ipaddress\nimport re\n\
    import time\nfrom urllib.parse import urlsplit\n\nimport sqlalchemy as sa\nfrom starlette.concurrency import\
    \ run_in_threadpool\n\nMAX_ADMIN_RECIPIENTS = 100\n\n\ndef safe_https_url(value):\n    if not isinstance(value,\
    \ str) or len(value) > 2048 or any(ord(c) < 33 or c == '\\\\' for c in value):\n        return False\n    try:\n\
    \        url = urlsplit(value)\n        if url.scheme != 'https' or not url.hostname or url.username or url.password\
    \ or url.fragment or url.port not in (None, 443):\n            return False\n        host=url.hostname.lower()\n\
    \        if host in ('localhost', 'localhost.localdomain') or host.endswith(('.localhost', '.local', '.internal')):\n\
    \            return False\n        try:\n            ip=ipaddress.ip_address(host)\n            if not ip.is_global:\n\
    \                return False\n        except ValueError:\n            pass\n        return True\n    except\
    \ (ValueError, TypeError):\n        return False\n\n\ndef build_interaction(body):\n    topic=body.get('topic')\n\
    \    title=body.get('title')\n    description=body.get('body','')\n    link=body.get('url')\n    ttl=body.get('ttlSeconds',86400)\n\
    \    if (not isinstance(topic,str) or not re.fullmatch(r'[a-z][a-z0-9_.-]{1,79}',topic)\n            or not\
    \ isinstance(title,str) or not 1 <= len(title) <= 120\n            or not isinstance(description,str) or len(description)>2000\n\
    \            or any(ord(char)<32 or ord(char)==127 for char in topic+title)\n            or type(ttl) is not\
    \ int or not 60 <= ttl <= 604800):\n        return None\n    if link is not None and not safe_https_url(link):\n\
    \        return None\n    actions=[{'id':'open-link','type':'open-url','label':'Open details',\n           \
    \   'url':link,'presentation':'external-browser'}] if link else [\n              {'id':'acknowledge','type':'reply','label':'Acknowledge','fields':[]}]\n\
    \    return {'topic':topic,'title':title,'body':description,'actions':actions},ttl\n\n\ndef principal_id(subject):\n\
    \    return hashlib.sha256(('tavi-social\\0'+subject).encode('utf8')).hexdigest()\n\n\ndef deliver(ctx):\n \
    \   if getattr(ctx.principal,'kind',None)!='service' or not re.fullmatch(r'[a-z][a-z0-9-]{1,47}',ctx.principal.subject\
    \ or ''):\n        return {'accepted':False,'recipients':0,'reason':'service_identity_required'}\n    constructed=build_interaction(ctx.body\
    \ or {})\n    if constructed is None:\n        return {'accepted':False,'recipients':0,'reason':'invalid_interaction'}\n\
    \    data,ttl=constructed\n    now=int(time.time())\n    with ctx.transaction() as session:\n        admins=session.execute(sa.text('SELECT\
    \ id FROM \"SocialAccount\" WHERE \"ecosystemAdmin\" = 1 ORDER BY id LIMIT :limit'),\n            {'limit':MAX_ADMIN_RECIPIENTS+1}).scalars().all()\n\
    \        if len(admins)>MAX_ADMIN_RECIPIENTS:\n            return {'accepted':False,'recipients':0,'reason':'recipient_limit'}\n\
    \        if not admins:\n            return {'accepted':True,'recipients':0}\n        for account_id in admins:\n\
    \            subject='acct_'+str(account_id)\n            session.execute(sa.text('''INSERT INTO \"SocialInteraction\"\
    \ (\"recipient\",\"publisher\",\"topic\",\"title\",\"data\",\"status\",\"response\",\"created\",\"expires\"\
    )\n                VALUES (:recipient,:publisher,:topic,:title,:data,'open',NULL,:created,:expires)'''),\n \
    \               {'recipient':subject,'publisher':'service:'+ctx.principal.subject,\n                 'topic':data['topic'],'title':data['title'],\n\
    \                 'data':json.dumps(data),'created':now,'expires':now+ttl})\n        row=session.execute(sa.text('SELECT\
    \ signal FROM \"SocialPulse\" WHERE id=1')).first()\n        signal=(row[0] if row else 0)+1\n        if row:\n\
    \            session.execute(sa.text('UPDATE \"SocialPulse\" SET signal=:signal WHERE id=1'),{'signal':signal})\n\
    \        else:\n            session.execute(sa.text('INSERT INTO \"SocialPulse\" (id,signal) VALUES (1,:signal)'),{'signal':signal})\n\
    \        ctx.emit(session,{'resource':'pulses','action':'updated','id':1,'data':{'id':1,'signal':signal}})\n\
    \        for account_id in admins:\n            ctx.notify(session,principal_id('acct_'+str(account_id)))\n\
    \    return {'accepted':True,'recipients':len(admins)}\n\n\nasync def handle(ctx):\n    return await run_in_threadpool(deliver,ctx)\n"
  contract:
    name: tavi-admin-notify
    version: 1
    serviceOnly: true
    request:
      type: object
      required:
      - topic
      - title
      additionalProperties: false
      properties:
        topic:
          type: string
          minLength: 2
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
    response:
      type: object
      required:
      - accepted
      - recipients
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        recipients:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 48
- path: /ecosystem/admin-role
  method: POST
  kind: python
  scopes:
  - social:service
  source: "\"\"\"Trusted service contract for checking the current Tavi administrator role.\"\"\"\nimport re\nimport\
    \ sqlalchemy as sa\nfrom starlette.concurrency import run_in_threadpool\n\n\ndef current_role(sessions, subject):\n\
    \    if not isinstance(subject,str) or not re.fullmatch(r'acct_[1-9][0-9]{0,18}',subject):\n        return False\n\
    \    with sessions() as db:\n        return db.execute(sa.text('SELECT \"ecosystemAdmin\" FROM \"SocialAccount\"\
    \ WHERE id=:id'),\n            {'id':int(subject[5:])}).scalar() == 1\n\n\nasync def handle(ctx):\n    if getattr(ctx.principal,'kind',None)!='service':\n\
    \        return {'admin':False}\n    return {'admin':await run_in_threadpool(current_role,ctx.session_factory,(ctx.body\
    \ or {}).get('subject'))}\n"
  contract:
    name: tavi-admin-role
    version: 1
    serviceOnly: true
    request:
      type: object
      required:
      - subject
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 6
          maxLength: 72
    response:
      type: object
      required:
      - admin
      additionalProperties: false
      properties:
        admin:
          type: boolean
