  verifier:
    kind: python
    source: "\"\"\"LoopRD verified identity adapter for Tavi Social sessions.\n\nThe public guest credential is\
      \ an *unprivileged protocol marker*, not a secret.\nIt only permits sign-up/sign-in/discovery through the\
      \ Social handler. Normal\nsessions are checked against the database on every HTTP request, and LoopRD\nbinds\
      \ devices to the stable realm/subject principal.\n\"\"\"\nimport hashlib\nimport hmac\nimport time\nimport\
      \ json\nimport os\nimport re\nimport sqlalchemy as sa\n\nGUEST_CREDENTIAL = \"tavi_guest_v1\"  # public, unprivileged,\
      \ NOT an authentication secret\nSOCIAL_SCOPES = ['social:api']\nUSER_SCOPES = ['social:api', 'events:read',\
      \ 'push:manage']\nSERVICE_SCOPES = ['social:service']\n\n\ndef lookup_session(session_factory, credential):\n\
      \    if not isinstance(credential, str) or not 32 <= len(credential) <= 256:\n        return None\n    digest\
      \ = hashlib.sha256(credential.encode('utf8')).hexdigest()\n    now = time.time()\n    with session_factory()\
      \ as db:\n        row = db.execute(sa.text('''SELECT id, subjectId, expires FROM \"SocialSession\"\n     \
      \       WHERE tokenHash = :digest AND revoked = 0 AND expires > :now\n            LIMIT 1'''), {'digest':\
      \ digest, 'now': now}).mappings().first()\n    if not row or not isinstance(row['subjectId'], str) or not\
      \ row['subjectId'].startswith('acct_'):\n        return None\n    return {'subject': row['subjectId'], 'label':\
      \ 'Tavi user', 'kind': 'user',\n            'sessionId': str(row['id']), 'expiresAt': float(row['expires']),\n\
      \            'scopes': USER_SCOPES}\n\n\ndef configured_service_refs():\n    \"\"\"Private operator mapping:\
      \ component IDs -> names of mounted secret references.\"\"\"\n    try:\n        mapping=json.loads(os.environ.get('LOOPRD_SOCIAL_SERVICE_SECRETS_JSON','{}'))\n\
      \    except (ValueError,TypeError):\n        return {}\n    if not isinstance(mapping,dict) or len(mapping)>32:\n\
      \        return {}\n    return {name:ref for name,ref in mapping.items()\n        if isinstance(name,str)\
      \ and re.fullmatch(r'[a-z][a-z0-9-]{1,47}',name)\n        and isinstance(ref,str) and re.fullmatch(r'[a-zA-Z0-9_./-]{1,200}',ref)\n\
      \        and '..' not in ref.split('/') and not ref.startswith('/')}\n\n\ndef service_identity(credential,\
      \ secret_reader):\n    if not isinstance(credential,str) or not 32 <= len(credential) <= 256:\n        return\
      \ None\n    received=hashlib.sha256(credential.encode('utf8')).digest()\n    for name,reference in configured_service_refs().items():\n\
      \        try:\n            secret=secret_reader(reference)\n            if not isinstance(secret,str) or len(secret)<32:\n\
      \                continue\n            expected=hashlib.sha256(secret.strip().encode('utf8')).digest()\n \
      \           if hmac.compare_digest(received,expected):\n                return {'subject':name,'label':'Tavi\
      \ trusted service', 'kind':'service',\n                        'scopes':SERVICE_SCOPES}\n        except (ValueError,OSError,KeyError):\n\
      \            continue\n    return None\n\n\nasync def verify(ctx):\n    if hmac.compare_digest(ctx.credential,\
      \ GUEST_CREDENTIAL):\n        return {'subject': 'guest', 'label': 'Tavi guest', 'kind': 'service', 'scopes':\
      \ SOCIAL_SCOPES}\n    service=service_identity(ctx.credential,ctx.secret)\n    if service is not None:\n \
      \       return service\n    if ctx.session_factory is None:\n        return None\n    return await ctx.run(lookup_session,\
      \ ctx.session_factory, ctx.credential)\n"
