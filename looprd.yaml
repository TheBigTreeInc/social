handlers:
- path: /social
  method: POST
  kind: python
  scopes:
  - social:api
  source: "\"\"\"Tavi Social native LoopRD handler with verified identities and durable wake hints.\n\nEmbedded\
    \ in looprd.yaml by tools/generate-looprd.py. Account authentication\nand push-device ownership are independently\
    \ enforced by LoopRD's verifier.\n\"\"\"\nimport hashlib\nimport hmac\nimport json\nimport os\nimport re\nimport\
    \ time\nimport sqlalchemy as sa\nfrom contextlib import nullcontext\nfrom starlette.concurrency import run_in_threadpool\n\
    \nSCHEMA = 'looprd.social.profile/v1'\nAPPEARANCE_SCHEMA = 'modular-portraits.identity/v1'\nPORTRAIT_NUMBER\
    \ = re.compile(r'^[1-9][0-9]{0,511}$')\nSOCIAL = 'looprd-social'\nPROFILE = sa.table('SocialProfile',\n    sa.column('id',\
    \ sa.Integer), sa.column('subjectId', sa.String),\n    sa.column('data', sa.JSON), sa.column('revision', sa.Integer),\n\
    \    sa.column('updated', sa.Integer))\nMESSAGE = sa.table('SocialMessage',\n    sa.column('id', sa.Integer),\
    \ sa.column('subjectId', sa.String),\n    sa.column('displayName', sa.String), sa.column('content', sa.String),\n\
    \    sa.column('created', sa.Integer))\nPULSE = sa.table('SocialPulse', sa.column('id', sa.Integer),sa.column('signal',\
    \ sa.Integer))\nSUBJECT = re.compile(r'^[a-zA-Z0-9_-]{8,72}$')\nSLOT = re.compile(r'^[a-z0-9-]{1,64}$')\nCOLOR\
    \ = re.compile(r'^#[a-fA-F0-9]{6}$')\n\n\n# Tavi interactive events: persistent, server-authorized, bounded\
    \ payloads.\nINTERACTION = sa.table('SocialInteraction', sa.column('id', sa.Integer),\n    sa.column('recipient',\
    \ sa.String), sa.column('publisher', sa.String),\n    sa.column('topic', sa.String), sa.column('title', sa.String),\n\
    \    sa.column('data', sa.JSON), sa.column('status', sa.String),\n    sa.column('response', sa.JSON), sa.column('created',\
    \ sa.Integer),\n    sa.column('expires', sa.Integer))\nACTION_ID = re.compile(r'^[a-z][a-z0-9_-]{0,47}$')\n\n\
    def validate_interaction(raw):\n    if not isinstance(raw,dict):raise ValueError('Interaction must be an object')\n\
    \    title=raw.get('title'); topic=raw.get('topic'); actions=raw.get('actions')\n    if not isinstance(title,str)\
    \ or not 1<=len(title)<=120 or re.search(r'[\\x00-\\x1f]',title):raise ValueError('Invalid event title')\n \
    \   if not isinstance(topic,str) or not re.fullmatch(r'[a-z][a-z0-9_.-]{1,80}',topic):raise ValueError('Invalid\
    \ event topic')\n    if not isinstance(actions,list) or not 1<=len(actions)<=6:raise ValueError('Provide 1–6\
    \ actions')\n    cleaned=[]; used=set()\n    for item in actions:\n        if not isinstance(item,dict):raise\
    \ ValueError('Invalid action')\n        aid=item.get('id'); kind=item.get('type'); label=item.get('label')\n\
    \        if not isinstance(aid,str) or not ACTION_ID.fullmatch(aid) or aid in used:raise ValueError('Invalid\
    \ action ID')\n        if kind not in ('reply','open-url'):raise ValueError('Unsupported action type')\n   \
    \     if not isinstance(label,str) or not 1<=len(label)<=48:raise ValueError('Invalid action label')\n     \
    \   entry={'id':aid,'type':kind,'label':label}\n        if kind=='open-url':\n            from urllib.parse\
    \ import urlsplit\n            url=item.get('url')\n            try:\n                u=urlsplit(url) if isinstance(url,str)\
    \ else None\n                if not u or u.scheme!='https' or not u.hostname or u.username or u.password or\
    \ u.fragment or len(url)>2048 or u.port not in (None,443):raise ValueError()\n                import ipaddress\n\
    \                try: ip=ipaddress.ip_address(u.hostname)\n                except ValueError: ip=None\n    \
    \            if (ip is not None and not ip.is_global) or u.hostname in ('localhost','localhost.localdomain')\
    \ or u.hostname.endswith(('.localhost','.local','.internal')):raise ValueError()\n            except (ValueError,TypeError):raise\
    \ ValueError('Invalid external HTTPS URL')\n            entry['url']=url; entry['presentation']=item.get('presentation')\
    \ if item.get('presentation') in ('external-browser','native-webview') else 'external-browser'\n        else:\n\
    \            fields=item.get('fields',[])\n            if not isinstance(fields,list) or len(fields)>6:raise\
    \ ValueError('Invalid reply fields')\n            parsed=[]\n            for field in fields:\n            \
    \    if not isinstance(field,dict) or not isinstance(field.get('id'),str) or not ACTION_ID.fullmatch(field['id'])\
    \ or field.get('type') not in ('text','textarea','select'):raise ValueError('Invalid reply field')\n       \
    \         entryfield={'id':field['id'],'type':field['type'],'label':str(field.get('label',field['id']))[:60]}\n\
    \                if field['type']=='select':\n                    options=field.get('options')\n           \
    \         if not isinstance(options,list) or not 1<=len(options)<=12 or not all(isinstance(x,str) and 1<=len(x)<=80\
    \ for x in options):raise ValueError('Invalid field options')\n                    entryfield['options']=options\n\
    \                parsed.append(entryfield)\n            entry['fields']=parsed\n        cleaned.append(entry);used.add(aid)\n\
    \    message=raw.get('body','')\n    if not isinstance(message,str) or len(message)>2000:raise ValueError('Invalid\
    \ event body')\n    return {'title':title,'body':message,'topic':topic,'actions':cleaned}\n\ndef interaction_feed(db,subject,now):\n\
    \    query=sa.select(INTERACTION).where(INTERACTION.c.recipient==subject)\n    if not account_ecosystem_admin(db,subject):\n\
    \        query=query.where(sa.not_(INTERACTION.c.publisher.like('service:%')))\n    rows=db.execute(query.order_by(INTERACTION.c.id.desc()).limit(80)).mappings().all()\n\
    \    return {'ok':True,'schema':'tavi.interactions/v1','events':[\n      {'id':r['id'],'publisher':r['publisher'],'topic':r['topic'],**r['data'],\n\
    \       'status':('expired' if r['expires']<=now and r['status']=='open' else r['status']),\n       'created':r['created'],'expires':r['expires'],'response':r['response']}\n\
    \      for r in rows]}\n\ndef interaction_reply(db,subject,body,now):\n    event_id=body.get('id');action=body.get('action');values=body.get('values',{})\n\
    \    if type(event_id) is not int or not isinstance(action,str) or not isinstance(values,dict):return error('Invalid\
    \ event response')\n    row=db.execute(sa.select(INTERACTION).where(INTERACTION.c.id==event_id,INTERACTION.c.recipient==subject)).mappings().first()\n\
    \    if not row:return error('Event not found')\n    if row['publisher'].startswith('service:') and not account_ecosystem_admin(db,subject):return\
    \ error('Administrator entitlement revoked')\n    if row['status']!='open' or row['expires']<=now:return error('Event\
