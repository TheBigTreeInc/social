<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaviX UI contract sample</title></head>
<body><main id="studio" class="tavix-app" aria-label="Example TaviX application">
  <header class="tavix-app-header"><h1>Example Studio</h1><button type="button" class="tavix-button" id="exit">Return to Tavi</button></header>
  <section class="tavix-stack" style="padding:16px">
    <nav class="tavix-tabs" role="tablist" aria-label="Studio pages"><button type="button" class="tavix-tab" role="tab" aria-selected="true" id="resources">Resources</button><button type="button" class="tavix-tab" role="tab" aria-selected="false" id="preview">Preview</button></nav>
    <div class="tavix-grid"><section class="tavix-panel"><h2>Resource browser</h2><label class="tavix-field">Find resource<input class="tavix-input" type="search" placeholder="Search local resources"></label></section><section class="tavix-panel"><h2>Details</h2><p id="host-details">Reading host capabilities…</p></section></div>
  </section>
</main><script type="module" src="./main.js"></script></body></html>
