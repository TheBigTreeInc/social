<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><title>Private Notepad</title><style>body{font:14px system-ui,sans-serif;background:#e9f5ee;color:#163e32;margin:0;padding:18px}h2{margin:0 0 8px}p{line-height:1.4}textarea{box-sizing:border-box;width:100%;height:180px;padding:10px;border:1px solid #699786;border-radius:7px;resize:vertical}button{background:#23674e;color:#fff;border:0;border-radius:6px;padding:10px 16px;margin-top:10px;cursor:pointer}#status{display:inline-block;margin-left:10px}</style></head><body><h2>Private Notepad</h2><p>This isolated extension can save only its own notes. It cannot read Tavi messages, friends or sign-in credentials.</p><label for="note">Your note</label><textarea id="note" maxlength="8192"></textarea><div><button id="save">Save note</button><span id="status" role="status"></span></div><script>
(()=>{
 const channel='tavi.extension/v1', pending=new Map();let counter=0;
 window.addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!==channel||e.data?.direction!=='response')return;const request=pending.get(e.data.id);if(!request)return;pending.delete(e.data.id);e.data.ok?request.resolve(e.data.result):request.reject(Error(e.data.error));});
 const request=(method,fields={})=>new Promise((resolve,reject)=>{const id=++counter;pending.set(id,{resolve,reject});parent.postMessage({channel,direction:'request',id,method,...fields},'*');});
 const status=document.getElementById('status');
 request('storage.get',{key:'note'}).then(value=>{document.getElementById('note').value=value||'';}).catch(e=>{status.textContent=e.message;});
 document.getElementById('save').addEventListener('click',async()=>{try{await request('storage.set',{key:'note',value:document.getElementById('note').value});status.textContent='Saved on this device';await request('ui.toast',{message:'Private Notepad saved'});}catch(e){status.textContent=e.message;}});
})();
</script></body></html>
