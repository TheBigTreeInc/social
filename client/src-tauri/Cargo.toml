[package]
name = "looprd-social-client"
version = "0.3.64"
description = "LoopRD-backed gaming social client"
authors = ["TheBigTreeInc"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "looprd_social_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde_json = "1"
